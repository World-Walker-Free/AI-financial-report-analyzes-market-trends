<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>研报原文（Mock 示例页）</title>
<style>
  body{ margin:0; background:#f2f4f7; font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; color:#1f2329; }
  .wrap{ max-width:760px; margin:48px auto; background:#fff; border:1px solid #e6e9ee; border-radius:8px; padding:28px 32px; }
  .tag{ display:inline-block; background:#fdece0; color:#c96a1c; font-size:12px; padding:3px 9px; border-radius:4px; margin-bottom:14px; }
  h1{ font-size:20px; margin:0 0 6px; }
  .sub{ color:#646a73; font-size:13px; margin-bottom:22px; }
  .meta{ border-top:1px solid #e6e9ee; border-bottom:1px solid #e6e9ee; padding:12px 0; margin-bottom:20px; font-size:13px; line-height:2; }
  .meta b{ display:inline-block; width:88px; color:#646a73; font-weight:400; }
  .note{ background:#f7f8fa; border-left:3px solid #f08c3a; padding:12px 14px; font-size:13px; line-height:1.9; color:#3f4652; }
  p{ font-size:14px; line-height:2; color:#3f4652; }
  code{ background:#f2f4f7; padding:1px 5px; border-radius:3px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">Mock 示例页 · 非真实研报</div>
  <h1>期货研报原文占位页</h1>
  <div class="sub">AI 研报观点 · 市场走势看板 — 原文溯源演示</div>

  <div class="meta">
    <div><b>研报编号</b><span id="rid">--</span></div>
    <div><b>发布机构</b><span id="org">--</span></div>
    <div><b>报告日期</b><span id="date">--</span></div>
    <div><b>观点方向</b><span id="side">--</span></div>
  </div>

  <p>本页用于 D1～D2 的「查看原文」链路演示：点击看板里的链接会打开本页，
     说明跳转通路是通的，且能带出具体研报编号、机构与日期。</p>

  <div class="note">
    <b>D3 联调时请替换：</b>由 C 在 <code>/views</code> 的 <code>url</code> 字段返回真实研报地址
     （内网 PDF / HTML 或带锚点的原文链接），本占位页就不再使用。<br>
     ⚠️ 契约里明确要求 <code>url</code> 不能是 <code>#</code> 或空值 —— 「点击能定位到原研报」是 P0 验收项。
  </div>
</div>

<script>
  var q = new URLSearchParams(location.search)
  var rid = q.get('rid') || '--'
  var set = function (id, v) { document.getElementById(id).textContent = v }
  set('rid', rid)
  set('org', q.get('org') || '--')
  set('date', q.get('date') || '--')
  var tail = rid.slice(-2, -1)
  set('side', tail === 'B' ? '看多' : tail === 'S' ? '看空' : tail === 'N' ? '看平' : '--')
</script>
</body>
</html>
